
name: flutter_app
description: A Flutter app to upload videos to YouTube.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.1.5
  http: ^0.13.4
  shared_preferences: ^2.0.15
  flutter_secure_storage: ^9.2.4
  photo_manager: ^3.8.0
  fluttertoast: ^8.2.4
  flutter_web_auth: ^0.6.0
  flutter_background_service: ^2.4.0
  flutter_app_badger: ^1.5.0
  intl: ^0.18.0
  url_launcher: ^6.1.11
  flutter_inappwebview: ^6.0.0
  video_player: ^2.6.1
  tg: ^0.0.20

flutter:
  uses-material-design: true
  config:
    enable-lldb-debugging: false
